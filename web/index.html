<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bevy Transform Tools</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #080a0f;
        touch-action: none;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      canvas {
        width: 100% !important;
        height: 100% !important;
        display: block;
      }

      .toolbar {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 10;
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 8px;
        border: 1px solid rgb(255 255 255 / 14%);
        border-radius: 8px;
        background: rgb(12 15 22 / 86%);
        color: white;
        box-shadow: 0 12px 30px rgb(0 0 0 / 24%);
        backdrop-filter: blur(8px);
      }

      .toolbar input[type="file"] {
        max-width: 240px;
        color: white;
      }

      .toolbar button {
        height: 32px;
        border: 1px solid rgb(255 255 255 / 18%);
        border-radius: 6px;
        background: #f4f7fb;
        color: #111827;
        cursor: pointer;
      }

      .toolbar button:active {
        transform: translateY(1px);
      }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <input id="model-file" type="file" accept=".obj,.stl" />
      <button id="reset-transform" type="button">Reset</button>
      <button id="clear-models" type="button">Clear</button>
    </div>

    <script type="module">
      import init, {
        clear_scene_models,
        get_selected_model_id,
        load_obj_model,
        load_stl_model,
        set_transform,
      } from "./pkg/bevy_transform_tools.js";

      await init();

      window.addEventListener(
        "wheel",
        (event) => {
          if (event.ctrlKey || event.metaKey) {
            event.preventDefault();
          }
        },
        { passive: false },
      );

      for (const eventName of ["gesturestart", "gesturechange", "gestureend"]) {
        window.addEventListener(eventName, (event) => event.preventDefault(), {
          passive: false,
        });
      }

      const fileInput = document.querySelector("#model-file");
      const resetButton = document.querySelector("#reset-transform");
      const clearButton = document.querySelector("#clear-models");

      fileInput.addEventListener("change", async () => {
        const file = fileInput.files?.[0];
        if (!file) return;

        const extension = file.name.split(".").pop()?.toLowerCase();
        if (extension === "obj") {
          load_obj_model(file.name, await file.text());
        } else if (extension === "stl") {
          load_stl_model(file.name, new Uint8Array(await file.arrayBuffer()));
        }

        fileInput.value = "";
      });

      resetButton.addEventListener("click", () => {
        const id = get_selected_model_id();
        if (id !== 0) {
          set_transform(id, 0, 0, 0, 0, 0, 0, 1, 1, 1);
        }
      });

      clearButton.addEventListener("click", () => {
        clear_scene_models();
      });
    </script>
  </body>
</html>
