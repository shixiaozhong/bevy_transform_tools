<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bevy Transform Tools</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #080a0f;
        touch-action: none;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC",
          sans-serif;
      }

      canvas {
        width: 100% !important;
        height: 100% !important;
        display: block;
      }

      .toolbar-shell {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 10;
        display: flex;
        justify-content: center;
        padding: 0 8px;
        pointer-events: none;
      }

      .toolbar {
        display: flex;
        align-items: center;
        gap: 4px;
        min-height: 78px;
        max-width: calc(100vw - 24px);
        overflow-x: auto;
        overflow-y: hidden;
        padding: 6px 12px 8px;
        border: 1px solid rgb(255 255 255 / 7%);
        border-top: 0;
        border-radius: 0 0 12px 12px;
        background: rgb(45 52 49 / 92%);
        color: #d9dddc;
        box-shadow: 0 14px 28px rgb(0 0 0 / 34%);
        backdrop-filter: blur(10px);
        pointer-events: auto;
        scrollbar-width: none;
      }

      .toolbar::-webkit-scrollbar {
        display: none;
      }

      .toolbar input[type="file"],
      .toolbar input[type="color"] {
        display: none;
      }

      .tool-button {
        width: 74px;
        height: 66px;
        flex: 0 0 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: rgb(235 239 238 / 88%);
        cursor: pointer;
      }

      .tool-button svg {
        width: 38px;
        height: 38px;
        stroke: currentColor;
        stroke-width: 1.8;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .color-swatch {
        width: 30px;
        height: 30px;
        border: 2px solid currentColor;
        border-radius: 50%;
        background: var(--model-color, #9eb0c7);
        box-shadow: inset 0 0 0 3px rgb(0 0 0 / 18%);
      }

      .tool-label {
        width: 100%;
        overflow: hidden;
        color: currentColor;
        font-size: 11px;
        line-height: 14px;
        letter-spacing: 0;
        text-align: center;
        white-space: nowrap;
      }

      .tool-button:hover,
      .tool-button:focus-visible {
        outline: none;
        background: rgb(255 255 255 / 8%);
        color: #ffffff;
      }

      .tool-button:active {
        background: rgb(255 255 255 / 14%);
      }

      .tool-button.is-active {
        background: rgb(255 255 255 / 12%);
        color: #ffffff;
      }

      .tool-button:disabled {
        color: rgb(196 202 207 / 56%);
        cursor: default;
      }

      .tool-button:disabled:hover {
        background: transparent;
      }

      .toolbar-divider {
        width: 1px;
        height: 52px;
        flex: 0 0 auto;
        margin: 0 10px;
        background: rgb(255 255 255 / 45%);
      }

      .model-info-panel {
        position: fixed;
        right: 18px;
        bottom: 18px;
        z-index: 9;
        width: min(360px, calc(100vw - 32px));
        box-sizing: border-box;
        overflow: hidden;
        padding: 10px 14px 10px 16px;
        border: 1px solid rgb(66 226 126 / 42%);
        border-radius: 6px;
        background: rgb(18 22 24 / 88%);
        color: #edf2ef;
        font-size: 13px;
        line-height: 1.5;
        white-space: pre-line;
        box-shadow: 0 10px 26px rgb(0 0 0 / 32%);
        backdrop-filter: blur(8px);
        pointer-events: none;
      }

      .model-info-panel::before {
        position: absolute;
        top: 8px;
        bottom: 8px;
        left: 6px;
        width: 3px;
        border-radius: 999px;
        background: linear-gradient(180deg, #39e881, #10a35b);
        content: "";
      }

      .model-info-panel[hidden] {
        display: none;
      }

      .move-panel {
        position: fixed;
        top: 82px;
        left: 50%;
        z-index: 9;
        width: min(660px, calc(100vw - 28px));
        box-sizing: border-box;
        padding: 12px 16px 14px;
        border: 1px solid rgb(255 255 255 / 7%);
        border-top: 0;
        border-radius: 0 0 10px 10px;
        background: rgb(45 52 49 / 92%);
        color: #d9dddc;
        box-shadow: 0 14px 28px rgb(0 0 0 / 34%);
        backdrop-filter: blur(10px);
        transform: translateX(-50%);
        pointer-events: auto;
      }

      .move-panel[hidden] {
        display: none;
      }

      .move-panel-grid {
        display: grid;
        grid-template-columns: 120px repeat(3, minmax(96px, 1fr)) 36px 72px;
        gap: 8px 12px;
        align-items: center;
      }

      .move-mode-select,
      .move-number {
        height: 30px;
        box-sizing: border-box;
        border: 1px solid rgb(255 255 255 / 20%);
        border-radius: 5px;
        background: rgb(255 255 255 / 9%);
        color: #f2f5f4;
        font: inherit;
      }

      .move-mode-select {
        width: 120px;
        padding: 0 8px;
      }

      .move-mode-select option {
        background: #2d3431;
        color: #f2f5f4;
      }

      .move-number {
        width: 100%;
        padding: 0 8px;
      }

      .move-mode-select:focus,
      .move-number:focus {
        outline: none;
        border-color: rgb(255 255 255 / 42%);
        background: rgb(255 255 255 / 13%);
      }

      .move-axis-label {
        font-size: 14px;
        line-height: 18px;
        text-align: center;
      }

      .move-axis-x {
        color: #cc6969;
      }

      .move-axis-y {
        color: #6fc277;
      }

      .move-axis-z {
        color: #7b82cc;
      }

      .move-row-label,
      .move-unit {
        color: rgb(235 239 238 / 78%);
        font-size: 14px;
      }

      .move-apply {
        height: 30px;
        border: 1px solid rgb(65 226 126 / 50%);
        border-radius: 5px;
        background: rgb(36 185 107 / 88%);
        color: #ffffff;
        font: inherit;
        cursor: pointer;
      }

      .move-apply:hover,
      .move-apply:focus-visible {
        outline: none;
        background: rgb(42 205 121 / 94%);
      }

      .move-secondary {
        grid-column: 1 / -1;
        display: flex;
        gap: 10px;
        align-items: center;
        min-height: 28px;
        padding-top: 6px;
        border-top: 1px solid rgb(255 255 255 / 10%);
      }

      .move-chip {
        height: 24px;
        padding: 0 9px;
        border: 1px solid rgb(255 255 255 / 16%);
        border-radius: 5px;
        background: rgb(255 255 255 / 8%);
        color: rgb(235 239 238 / 82%);
        font-size: 13px;
        cursor: pointer;
      }

      .move-chip:hover,
      .move-chip:focus-visible {
        outline: none;
        background: rgb(255 255 255 / 13%);
        color: #ffffff;
      }

      .panel-checkbox {
        display: inline-flex;
        gap: 7px;
        align-items: center;
        color: rgb(235 239 238 / 84%);
        font-size: 13px;
        user-select: none;
      }

      .panel-checkbox input {
        width: 14px;
        height: 14px;
        accent-color: #24b96b;
      }

      @media (max-width: 720px) {
        .toolbar-shell {
          justify-content: flex-start;
          padding: 0 8px;
        }

        .toolbar {
          min-height: 64px;
          padding: 5px 8px 7px;
        }

        .tool-button {
          width: 62px;
          height: 54px;
        }

        .tool-button svg {
          width: 30px;
          height: 30px;
        }

        .tool-label {
          font-size: 10px;
          line-height: 12px;
        }

        .toolbar-divider {
          height: 42px;
          margin: 0 6px;
        }

        .model-info-panel {
          right: 10px;
          bottom: 10px;
          width: calc(100vw - 20px);
          font-size: 12px;
        }

        .move-panel {
          top: 68px;
          padding: 9px 10px 11px;
        }

        .move-panel-grid {
          grid-template-columns: 88px repeat(3, minmax(64px, 1fr)) 28px;
          gap: 7px;
        }

        .move-mode-select {
          width: 88px;
        }

        .move-apply {
          grid-column: 1 / -1;
        }

      }
    </style>
  </head>
  <body>
    <div class="toolbar-shell">
      <div class="toolbar" role="toolbar" aria-label="Model tools">
        <input id="model-file" type="file" accept=".obj,.stl" />
        <input id="model-color" type="color" value="#9eb0c7" />
        <button
          id="import-model"
          class="tool-button"
          type="button"
          title="导入模型"
          aria-label="导入模型"
        >
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <path d="M13 19 31 9l18 10v22L31 51 13 41Z" />
            <path d="M13 19 31 29l18-10" />
            <path d="M31 29v22" />
            <circle cx="49" cy="46" r="10" />
            <path d="M49 39v14M42 46h14" />
          </svg>
          <span class="tool-label">导入模型</span>
        </button>
        <div class="toolbar-divider" aria-hidden="true"></div>
        <button
          id="move-tool"
          class="tool-button"
          type="button"
          title="移动"
          aria-label="移动"
          data-requires-selection
          disabled
        >
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <path d="M32 8v48" />
            <path d="M24 16 32 8l8 8" />
            <path d="M24 48 32 56l8-8" />
            <path d="M8 32h48" />
            <path d="M16 24 8 32l8 8" />
            <path d="M48 24 56 32l-8 8" />
            <path d="M24 24h16v16H24Z" />
          </svg>
          <span class="tool-label">移动</span>
        </button>
        <button
          id="scale-tool"
          class="tool-button"
          type="button"
          title="缩放"
          aria-label="缩放"
          data-requires-selection
          disabled
        >
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <path d="M15 15h14M15 15v14M49 49H35M49 49V35" />
            <path d="M20 20 30 30M44 44 34 34" />
            <path d="M35 15h14v14M49 15 37 27" />
            <path d="M15 35v14h14M15 49l12-12" />
            <path d="M25 25h14v14H25Z" />
          </svg>
          <span class="tool-label">缩放</span>
        </button>
        <button
          id="rotate-tool"
          class="tool-button"
          type="button"
          title="旋转"
          aria-label="旋转"
          data-requires-selection
          disabled
        >
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <path d="M45 18a19 19 0 1 0 5 20" />
            <path d="M45 18h11V7" />
            <path d="M23 25h18v18H23Z" />
            <path d="M32 18v7M32 43v7" />
          </svg>
          <span class="tool-label">旋转</span>
        </button>
        <button
          class="tool-button"
          type="button"
          title="选择底面"
          aria-label="选择底面"
          data-requires-selection
          disabled
        >
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <path d="M16 18 32 9l16 9v20L32 47 16 38Z" />
            <path d="M16 18 32 27l16-9" />
            <path d="M32 27v20" />
            <path d="M18 40 32 32l14 8-14 8Z" />
            <path d="M22 50h20" />
          </svg>
          <span class="tool-label">选择底面</span>
        </button>
        <button
          class="tool-button"
          type="button"
          title="剪切"
          aria-label="剪切"
          data-requires-selection
          disabled
        >
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <path d="M14 20 32 10l18 10v18L32 48 14 38Z" />
            <path d="M14 20 32 30l18-10" />
            <path d="M18 47 50 17" />
            <circle cx="17" cy="50" r="5" />
            <circle cx="47" cy="20" r="5" />
          </svg>
          <span class="tool-label">剪切</span>
        </button>
        <div class="toolbar-divider" aria-hidden="true"></div>
        <button
          id="center-model"
          class="tool-button"
          type="button"
          title="居中"
          aria-label="居中"
          data-requires-selection
          disabled
        >
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <path d="M32 10v12M32 42v12M10 32h12M42 32h12" />
            <path d="M23 23h18v18H23Z" />
            <circle cx="32" cy="32" r="4" />
            <path d="M17 17 23 23M47 17 41 23M17 47 23 41M47 47 41 41" />
          </svg>
          <span class="tool-label">居中</span>
        </button>
        <button
          id="drop-model"
          class="tool-button"
          type="button"
          title="贴底面"
          aria-label="贴底面"
          data-requires-selection
          disabled
        >
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <path d="M16 17 32 8l16 9v19L32 45 16 36Z" />
            <path d="M16 17 32 26l16-9" />
            <path d="M32 26v19" />
            <path d="M32 46v9" />
            <path d="M24 48 32 56l8-8" />
            <path d="M13 56h38" />
          </svg>
          <span class="tool-label">贴底面</span>
        </button>
        <button
          id="color-model"
          class="tool-button"
          type="button"
          title="模型颜色"
          aria-label="模型颜色"
          data-requires-selection
          disabled
        >
          <span class="color-swatch" aria-hidden="true"></span>
          <span class="tool-label">颜色</span>
        </button>
        <button
          id="delete-model"
          class="tool-button"
          type="button"
          title="删除模型"
          aria-label="删除模型"
          data-requires-selection
          disabled
        >
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <path d="M20 21h24" />
            <path d="M26 21v-5h12v5" />
            <path d="M24 26v24h16V26" />
            <path d="M29 31v14M35 31v14" />
          </svg>
          <span class="tool-label">删除</span>
        </button>
      </div>
    </div>

    <div id="move-panel" class="move-panel" hidden>
      <div class="move-panel-grid">
        <select id="move-mode" class="move-mode-select" aria-label="移动方式">
          <option value="absolute">绝对坐标</option>
          <option value="relative">相对移动</option>
        </select>
        <div class="move-axis-label move-axis-x">X</div>
        <div class="move-axis-label move-axis-y">Y</div>
        <div class="move-axis-label move-axis-z">Z</div>
        <div></div>
        <div></div>
        <div id="move-value-label" class="move-row-label">位置</div>
        <input id="move-x" class="move-number" type="number" step="0.01" />
        <input id="move-y" class="move-number" type="number" step="0.01" />
        <input id="move-z" class="move-number" type="number" step="0.01" />
        <div class="move-unit">mm</div>
        <button id="move-apply" class="move-apply" type="button">应用</button>
        <div class="move-secondary">
          <button id="move-zero" class="move-chip" type="button">清零</button>
          <span id="move-current" class="move-row-label"></span>
        </div>
      </div>
    </div>

    <div id="rotate-panel" class="move-panel" hidden>
      <div class="move-panel-grid">
        <select id="rotate-mode" class="move-mode-select" aria-label="旋转方式">
          <option value="absolute">绝对角度</option>
          <option value="relative">相对旋转</option>
        </select>
        <div class="move-axis-label move-axis-x">X</div>
        <div class="move-axis-label move-axis-y">Y</div>
        <div class="move-axis-label move-axis-z">Z</div>
        <div></div>
        <div></div>
        <div id="rotate-value-label" class="move-row-label">角度</div>
        <input id="rotate-x" class="move-number" type="number" step="1" />
        <input id="rotate-y" class="move-number" type="number" step="1" />
        <input id="rotate-z" class="move-number" type="number" step="1" />
        <div class="move-unit">°</div>
        <button id="rotate-apply" class="move-apply" type="button">应用</button>
        <div class="move-secondary">
          <button id="rotate-zero" class="move-chip" type="button">清零</button>
          <span id="rotate-current" class="move-row-label"></span>
        </div>
      </div>
    </div>

    <div id="scale-panel" class="move-panel" hidden>
      <div class="move-panel-grid">
        <label class="panel-checkbox">
          <input id="scale-uniform" type="checkbox" checked />
          等比例缩放
        </label>
        <div class="move-axis-label move-axis-x">X</div>
        <div class="move-axis-label move-axis-y">Y</div>
        <div class="move-axis-label move-axis-z">Z</div>
        <div></div>
        <div></div>
        <div class="move-row-label">缩放</div>
        <input id="scale-x" class="move-number" type="number" step="0.01" />
        <input id="scale-y" class="move-number" type="number" step="0.01" />
        <input id="scale-z" class="move-number" type="number" step="0.01" />
        <div class="move-unit">%</div>
        <button id="scale-apply" class="move-apply" type="button">应用</button>
        <div class="move-row-label">大小</div>
        <input id="size-x" class="move-number" type="number" step="0.01" />
        <input id="size-y" class="move-number" type="number" step="0.01" />
        <input id="size-z" class="move-number" type="number" step="0.01" />
        <div class="move-unit">mm</div>
        <div></div>
      </div>
    </div>

    <div id="model-info-panel" class="model-info-panel" hidden></div>

    <script type="module">
      import init, {
        activate_move_tool_mode,
        activate_rotate_tool_mode,
        activate_scale_tool_mode,
        center_model,
        clear_tool_mode,
        delete_model,
        drop_model_to_platform,
        get_model_info_json,
        get_selected_bounds_json,
        get_model_transform_json,
        load_obj_model,
        load_stl_model,
        move_by,
        rotate_by_degrees,
        set_color,
        set_position,
        set_rotate_focus_axis,
        set_rotation,
        set_scale,
      } from "./pkg/bevy_transform_tools.js";

      await init();

      window.addEventListener(
        "wheel",
        (event) => {
          if (event.ctrlKey || event.metaKey) {
            event.preventDefault();
          }
        },
        { passive: false },
      );

      for (const eventName of ["gesturestart", "gesturechange", "gestureend"]) {
        window.addEventListener(eventName, (event) => event.preventDefault(), {
          passive: false,
        });
      }

      const fileInput = document.querySelector("#model-file");
      const importButton = document.querySelector("#import-model");
      const moveButton = document.querySelector("#move-tool");
      const scaleButton = document.querySelector("#scale-tool");
      const rotateButton = document.querySelector("#rotate-tool");
      const colorButton = document.querySelector("#color-model");
      const colorInput = document.querySelector("#model-color");
      const centerButton = document.querySelector("#center-model");
      const dropButton = document.querySelector("#drop-model");
      const deleteButton = document.querySelector("#delete-model");
      const movePanel = document.querySelector("#move-panel");
      const moveModeSelect = document.querySelector("#move-mode");
      const moveValueLabel = document.querySelector("#move-value-label");
      const moveXInput = document.querySelector("#move-x");
      const moveYInput = document.querySelector("#move-y");
      const moveZInput = document.querySelector("#move-z");
      const moveApplyButton = document.querySelector("#move-apply");
      const moveZeroButton = document.querySelector("#move-zero");
      const moveCurrent = document.querySelector("#move-current");
      const rotatePanel = document.querySelector("#rotate-panel");
      const rotateModeSelect = document.querySelector("#rotate-mode");
      const rotateValueLabel = document.querySelector("#rotate-value-label");
      const rotateXInput = document.querySelector("#rotate-x");
      const rotateYInput = document.querySelector("#rotate-y");
      const rotateZInput = document.querySelector("#rotate-z");
      const rotateApplyButton = document.querySelector("#rotate-apply");
      const rotateZeroButton = document.querySelector("#rotate-zero");
      const rotateCurrent = document.querySelector("#rotate-current");
      const scalePanel = document.querySelector("#scale-panel");
      const scaleXInput = document.querySelector("#scale-x");
      const scaleYInput = document.querySelector("#scale-y");
      const scaleZInput = document.querySelector("#scale-z");
      const sizeXInput = document.querySelector("#size-x");
      const sizeYInput = document.querySelector("#size-y");
      const sizeZInput = document.querySelector("#size-z");
      const scaleApplyButton = document.querySelector("#scale-apply");
      const scaleUniformInput = document.querySelector("#scale-uniform");
      const modelInfoPanel = document.querySelector("#model-info-panel");
      const selectionTools = document.querySelectorAll(
        "[data-requires-selection]",
      );
      let activeTool = null;
      let lastModelInfoJson = "";
      let scaleBaseSize = [0, 0, 0];
      let isSyncingScalePanel = false;

      importButton.addEventListener("click", () => {
        fileInput.click();
      });

      fileInput.addEventListener("change", async () => {
        const file = fileInput.files?.[0];
        if (!file) return;

        const extension = file.name.split(".").pop()?.toLowerCase();
        if (extension === "obj") {
          load_obj_model(file.name, await file.text());
        } else if (extension === "stl") {
          load_stl_model(file.name, new Uint8Array(await file.arrayBuffer()));
        }

        fileInput.value = "";
      });

      moveButton.addEventListener("click", () => {
        if (selectedModelId === 0) {
          return;
        }

        if (activeTool === "move") {
          clear_tool_mode();
          setActiveToolButton(null);
        } else {
          activate_move_tool_mode();
          setActiveToolButton("move");
          syncMovePanelFromSelection();
        }
      });

      rotateButton.addEventListener("click", () => {
        if (selectedModelId === 0) {
          return;
        }

        if (activeTool === "rotate") {
          clear_tool_mode();
          setActiveToolButton(null);
        } else {
          activate_rotate_tool_mode();
          setActiveToolButton("rotate");
          syncRotatePanelFromSelection();
        }
      });

      scaleButton.addEventListener("click", () => {
        if (selectedModelId === 0) {
          return;
        }

        if (activeTool === "scale") {
          clear_tool_mode();
          setActiveToolButton(null);
        } else {
          activate_scale_tool_mode();
          setActiveToolButton("scale");
          syncScalePanelFromSelection();
        }
      });

      colorButton.addEventListener("click", () => {
        if (selectedModelId !== 0) {
          colorInput.click();
        }
      });

      colorInput.addEventListener("input", () => {
        if (selectedModelId === 0) {
          return;
        }

        const color = parseHexColor(colorInput.value);
        document.documentElement.style.setProperty(
          "--model-color",
          colorInput.value,
        );
        set_color(selectedModelId, color.red, color.green, color.blue);
      });

      centerButton.addEventListener("click", () => {
        if (selectedModelId !== 0) {
          center_model(selectedModelId);
        }
      });

      dropButton.addEventListener("click", () => {
        if (selectedModelId !== 0) {
          drop_model_to_platform(selectedModelId);
        }
      });

      deleteButton.addEventListener("click", () => {
        if (selectedModelIds.length === 0) {
          return;
        }

        const ids = [...selectedModelIds];
        for (const id of ids) {
          delete_model(id);
        }
        selectedModelId = 0;
        selectedModelIds = [];
        lastModelInfoJson = "";
        setActiveToolButton(null);
        syncToolAvailability();
        updateModelInfoPanel();
      });

      moveModeSelect.addEventListener("change", () => {
        syncMovePanelFromSelection(true);
      });

      moveApplyButton.addEventListener("click", () => {
        applyMovePanelValues();
      });

      moveZeroButton.addEventListener("click", () => {
        moveXInput.value = "0.00";
        moveYInput.value = "0.00";
        moveZInput.value = "0.00";
      });

      for (const input of [moveXInput, moveYInput, moveZInput]) {
        input.addEventListener("keydown", (event) => {
          if (event.key === "Enter") {
            applyMovePanelValues();
          }
        });
      }

      rotateModeSelect.addEventListener("change", () => {
        syncRotatePanelFromSelection(true);
      });

      rotateApplyButton.addEventListener("click", () => {
        applyRotatePanelValues();
      });

      rotateZeroButton.addEventListener("click", () => {
        rotateXInput.value = "0.00";
        rotateYInput.value = "0.00";
        rotateZInput.value = "0.00";
      });

      const rotateInputs = [rotateXInput, rotateYInput, rotateZInput];
      rotateInputs.forEach((input, axis) => {
        input.addEventListener("focus", () => {
          set_rotate_focus_axis(axis);
        });
        input.addEventListener("blur", () => {
          setTimeout(() => {
            if (!rotateInputs.includes(document.activeElement)) {
              set_rotate_focus_axis(-1);
            }
          }, 0);
        });
        input.addEventListener("keydown", (event) => {
          if (event.key === "Enter") {
            applyRotatePanelValues();
          }
        });
      });

      scaleApplyButton.addEventListener("click", () => {
        applyScalePanelValues();
      });

      scaleUniformInput.addEventListener("change", () => {
        if (scaleUniformInput.checked) {
          syncLinkedScaleInputs(scaleXInput, 0);
        }
      });

      const scaleInputs = [
        scaleXInput,
        scaleYInput,
        scaleZInput,
        sizeXInput,
        sizeYInput,
        sizeZInput,
      ];
      scaleInputs.forEach((input, index) => {
        input.addEventListener("input", () => {
          syncLinkedScaleInputs(input, index);
        });
        input.addEventListener("keydown", (event) => {
          if (event.key === "Enter") {
            applyScalePanelValues();
          }
        });
        input.addEventListener("blur", () => {
          const percents = readScalePercents();
          writeScalePercents(percents);
          writeScaleSizes(sizesFromScalePercents(percents));
        });
      });

      const syncToolAvailability = () => {
        const hasSelection = selectedModelIds.length > 0;
        for (const button of selectionTools) {
          button.disabled = !hasSelection;
        }
        if (!hasSelection) {
          setActiveToolButton(null);
        }
      };

      const formatFixed = (value, digits) =>
        Number.isFinite(value) ? value.toFixed(digits) : (0).toFixed(digits);

      const parseHexColor = (value) => {
        const normalized = /^#[0-9a-f]{6}$/i.test(value) ? value : "#9eb0c7";
        const number = Number.parseInt(normalized.slice(1), 16);
        return {
          red: ((number >> 16) & 0xff) / 255,
          green: ((number >> 8) & 0xff) / 255,
          blue: (number & 0xff) / 255,
        };
      };

      const parseNumberInput = (input) => {
        const value = Number.parseFloat(input.value);
        return Number.isFinite(value) ? value : 0;
      };

      const getSelectedTransform = () => {
        if (selectedModelId === 0) {
          return null;
        }

        const transformJson = get_model_transform_json(selectedModelId);
        if (!transformJson || transformJson === "null") {
          return null;
        }

        return JSON.parse(transformJson);
      };

      const selectedTranslation = () => {
        const bounds = selectedBounds();
        if (bounds) {
          return worldToPlatformPosition(groupBoundsCenter(bounds));
        }

        const transform = getSelectedTransform();
        return worldToPlatformPosition(
          transform?.visual_position ?? transform?.translation ?? [0, 0, 0],
        );
      };

      const selectedRotation = () => {
        const transform = getSelectedTransform();
        return (transform?.rotation_degrees ?? [0, 0, 0]).map(normalizeDegrees);
      };

      const selectedScalePercent = () => {
        const transform = getSelectedTransform();
        const [x = 1, y = 1, z = 1] = transform?.scale ?? [1, 1, 1];
        return [x * 100, z * 100, y * 100];
      };

      const selectedModelSize = () => {
        const bounds = selectedBounds();
        if (bounds) {
          const size = groupBoundsSize(bounds);
          return [size[0], size[2], size[1]];
        }

        if (selectedModelId === 0) {
          return [0, 0, 0];
        }

        const infoJson = get_model_info_json(selectedModelId);
        if (!infoJson || infoJson === "null") {
          return [0, 0, 0];
        }

        const info = JSON.parse(infoJson);
        const [x = 0, y = 0, z = 0] = info.size ?? [0, 0, 0];
        return [x, z, y];
      };

      const selectedBounds = () => {
        if (selectedModelIds.length === 0) {
          return null;
        }

        const boundsJson = get_selected_bounds_json();
        if (!boundsJson || boundsJson === "null") {
          return null;
        }

        return JSON.parse(boundsJson);
      };

      const groupBoundsCenter = (bounds) => {
        const [minX = 0, minY = 0, minZ = 0] = bounds.min ?? [];
        const [maxX = 0, maxY = 0, maxZ = 0] = bounds.max ?? [];
        return [(minX + maxX) * 0.5, (minY + maxY) * 0.5, (minZ + maxZ) * 0.5];
      };

      const groupBoundsSize = (bounds) => {
        const [minX = 0, minY = 0, minZ = 0] = bounds.min ?? [];
        const [maxX = 0, maxY = 0, maxZ = 0] = bounds.max ?? [];
        return [maxX - minX, maxY - minY, maxZ - minZ];
      };

      const normalizeDegrees = (value) => {
        if (!Number.isFinite(value)) {
          return 0;
        }
        return ((((value + 180) % 360) + 360) % 360) - 180;
      };

      const worldToPlatformPosition = ([x = 0, y = 0, z = 0]) => [
        x,
        -z,
        y,
      ];

      const platformToWorldPosition = ([x = 0, y = 0, z = 0]) => [x, z, -y];

      const platformToWorldDelta = ([x = 0, y = 0, z = 0]) => [x, z, -y];

      const applyWorldPosition = (id, platformPosition) => {
        const [x, y, z] = platformToWorldPosition(platformPosition);
        set_position(id, x, y, z);
      };

      const applyWorldDelta = (id, platformDelta) => {
        const [x, y, z] = platformToWorldDelta(platformDelta);
        move_by(id, x, y, z);
      };

      const syncMovePanelFromSelection = (force = false) => {
        const visible = activeTool === "move" && selectedModelId !== 0;
        movePanel.hidden = !visible;
        if (!visible) {
          return;
        }

        const isEditing = movePanel.contains(document.activeElement);
        const isRelative = moveModeSelect.value === "relative";
        moveValueLabel.textContent = isRelative ? "偏移" : "位置";

        const [x, y, z] = selectedTranslation();
        moveCurrent.textContent = `当前位置：${formatFixed(x, 2)}, ${formatFixed(y, 2)}, ${formatFixed(z, 2)} mm`;

        if (!force && isEditing) {
          return;
        }

        if (isRelative) {
          moveXInput.value = "0.00";
          moveYInput.value = "0.00";
          moveZInput.value = "0.00";
        } else {
          moveXInput.value = formatFixed(x, 2);
          moveYInput.value = formatFixed(y, 2);
          moveZInput.value = formatFixed(z, 2);
        }
      };

      const applyMovePanelValues = () => {
        if (selectedModelId === 0) {
          return;
        }

        const x = parseNumberInput(moveXInput);
        const y = parseNumberInput(moveYInput);
        const z = parseNumberInput(moveZInput);

        if (moveModeSelect.value === "relative") {
          const [currentX, currentY, currentZ] = selectedTranslation();
          applyWorldDelta(selectedModelId, [x, y, z]);
          moveXInput.value = "0.00";
          moveYInput.value = "0.00";
          moveZInput.value = "0.00";
          moveCurrent.textContent = `当前位置：${formatFixed(currentX + x, 2)}, ${formatFixed(currentY + y, 2)}, ${formatFixed(currentZ + z, 2)} mm`;
        } else {
          applyWorldPosition(selectedModelId, [x, y, z]);
          moveXInput.value = formatFixed(x, 2);
          moveYInput.value = formatFixed(y, 2);
          moveZInput.value = formatFixed(z, 2);
          moveCurrent.textContent = `当前位置：${formatFixed(x, 2)}, ${formatFixed(y, 2)}, ${formatFixed(z, 2)} mm`;
        }
      };

      const syncRotatePanelFromSelection = (force = false) => {
        const visible = activeTool === "rotate" && selectedModelId !== 0;
        rotatePanel.hidden = !visible;
        if (!visible) {
          set_rotate_focus_axis(-1);
          return;
        }

        const isEditing = rotatePanel.contains(document.activeElement);
        const isRelative = rotateModeSelect.value === "relative";
        rotateValueLabel.textContent = isRelative ? "增量" : "角度";

        const [x, y, z] = selectedRotation();
        rotateCurrent.textContent = `当前角度：${formatFixed(x, 2)}, ${formatFixed(y, 2)}, ${formatFixed(z, 2)}°`;

        if (!force && isEditing) {
          return;
        }

        if (isRelative) {
          rotateXInput.value = "0.00";
          rotateYInput.value = "0.00";
          rotateZInput.value = "0.00";
        } else {
          rotateXInput.value = formatFixed(x, 2);
          rotateYInput.value = formatFixed(y, 2);
          rotateZInput.value = formatFixed(z, 2);
        }
      };

      const applyRotatePanelValues = () => {
        if (selectedModelId === 0) {
          return;
        }

        const x = parseNumberInput(rotateXInput);
        const y = parseNumberInput(rotateYInput);
        const z = parseNumberInput(rotateZInput);

        if (rotateModeSelect.value === "relative") {
          const [currentX, currentY, currentZ] = selectedRotation();
          rotate_by_degrees(selectedModelId, x, y, z);
          rotateXInput.value = "0.00";
          rotateYInput.value = "0.00";
          rotateZInput.value = "0.00";
          rotateCurrent.textContent = `当前角度：${formatFixed(normalizeDegrees(currentX + x), 2)}, ${formatFixed(normalizeDegrees(currentY + y), 2)}, ${formatFixed(normalizeDegrees(currentZ + z), 2)}°`;
        } else {
          set_rotation(selectedModelId, x, y, z);
          rotateXInput.value = formatFixed(x, 2);
          rotateYInput.value = formatFixed(y, 2);
          rotateZInput.value = formatFixed(z, 2);
          rotateCurrent.textContent = `当前角度：${formatFixed(normalizeDegrees(x), 2)}, ${formatFixed(normalizeDegrees(y), 2)}, ${formatFixed(normalizeDegrees(z), 2)}°`;
        }
      };

      const scalePercentInputs = [scaleXInput, scaleYInput, scaleZInput];
      const scaleSizeInputs = [sizeXInput, sizeYInput, sizeZInput];

      const readScalePercents = () =>
        scalePercentInputs.map((input) =>
          Math.max(parseNumberInput(input), 0.01),
        );

      const writeScalePercents = (values, skipInput = null) => {
        scalePercentInputs.forEach((input, index) => {
          if (input === skipInput) {
            return;
          }
          input.value = formatFixed(values[index], 2);
        });
      };

      const writeScaleSizes = (values, skipInput = null) => {
        scaleSizeInputs.forEach((input, index) => {
          if (input === skipInput) {
            return;
          }
          input.value = formatFixed(values[index], 2);
        });
      };

      const sizesFromScalePercents = (percents) =>
        percents.map((percent, index) => scaleBaseSize[index] * (percent / 100));

      const syncScalePanelFromSelection = (force = false) => {
        const visible = activeTool === "scale" && selectedModelId !== 0;
        scalePanel.hidden = !visible;
        if (!visible) {
          return;
        }

        const percents = selectedScalePercent();
        const sizes = selectedModelSize();
        const baseSize = sizes.map((size, index) => {
          const scale = percents[index] / 100;
          return Math.abs(scale) > 0.0001 ? size / scale : size;
        });
        const isEditing = scalePanel.contains(document.activeElement);

        if (force || !isEditing || scaleBaseSize.every((size) => size === 0)) {
          scaleBaseSize = baseSize;
        }

        if (!force && isEditing) {
          return;
        }

        isSyncingScalePanel = true;
        writeScalePercents(percents);
        writeScaleSizes(sizes);
        isSyncingScalePanel = false;
      };

      const syncLinkedScaleInputs = (input, index) => {
        if (isSyncingScalePanel) {
          return;
        }

        isSyncingScalePanel = true;
        let percents = readScalePercents();

        if (index < 3) {
          const percent = Math.max(parseNumberInput(input), 0.01);
          if (scaleUniformInput.checked) {
            percents = [percent, percent, percent];
            writeScalePercents(percents, input);
          }
          writeScaleSizes(sizesFromScalePercents(percents));
        } else {
          const sizeAxis = index - 3;
          const targetSize = Math.max(parseNumberInput(input), 0);

          if (scaleUniformInput.checked) {
            const currentSizes = sizesFromScalePercents(percents);
            const currentSize = currentSizes[sizeAxis];
            const factor = currentSize > 0 ? targetSize / currentSize : 1;
            percents = percents.map((percent) =>
              Math.max(percent * factor, 0.01),
            );
            writeScalePercents(percents);
            writeScaleSizes(sizesFromScalePercents(percents), input);
          } else {
            const baseSize = scaleBaseSize[sizeAxis];
            percents[sizeAxis] =
              baseSize > 0 ? Math.max((targetSize / baseSize) * 100, 0.01) : 0.01;
            writeScalePercents(percents);
            writeScaleSizes(sizesFromScalePercents(percents), input);
          }
        }

        isSyncingScalePanel = false;
      };

      const applyScalePanelValues = () => {
        if (selectedModelId === 0) {
          return;
        }

        const [x, y, z] = readScalePercents();
        const sizes = sizesFromScalePercents([x, y, z]);
        set_scale(selectedModelId, x / 100, z / 100, y / 100);
        writeScalePercents([x, y, z]);
        writeScaleSizes(sizes);
      };

      const updateModelInfoPanel = () => {
        if (selectedModelId === 0) {
          lastModelInfoJson = "";
          modelInfoPanel.hidden = true;
          modelInfoPanel.textContent = "";
          return;
        }

        const infoJson = get_model_info_json(selectedModelId);
        if (!infoJson || infoJson === "null") {
          lastModelInfoJson = "";
          modelInfoPanel.hidden = true;
          modelInfoPanel.textContent = "";
          return;
        }

        if (infoJson === lastModelInfoJson) {
          return;
        }
        lastModelInfoJson = infoJson;

        const info = JSON.parse(infoJson);
        const [width = 0, depth = 0, height = 0] = info.size ?? [];
        modelInfoPanel.textContent = [
          `对象名字：${info.name ?? ""}`,
          `大小： ${formatFixed(width, 3)} x ${formatFixed(depth, 3)} x ${formatFixed(height, 3)} 毫米`,
          `体积： ${formatFixed(info.volume, 2)} 立方毫米`,
          `三角形： ${info.triangle_count ?? 0}`,
        ].join("\n");
        modelInfoPanel.hidden = false;
      };

      const scheduleModelInfoRefresh = () => {
        updateModelInfoPanel();
        syncMovePanelFromSelection();
        syncRotatePanelFromSelection();
        syncScalePanelFromSelection();
        requestAnimationFrame(scheduleModelInfoRefresh);
      };

      const setActiveToolButton = (tool) => {
        activeTool = tool;
        moveButton.classList.toggle("is-active", tool === "move");
        scaleButton.classList.toggle("is-active", tool === "scale");
        rotateButton.classList.toggle("is-active", tool === "rotate");
        syncMovePanelFromSelection(true);
        syncRotatePanelFromSelection(true);
        syncScalePanelFromSelection(true);
      };
      let selectedModelId = 0;
      let selectedModelIds = [];

      window.addEventListener(
        "bevy-transform-tools:selection-change",
        (event) => {
          selectedModelId = event.detail?.selectedModelId ?? 0;
          selectedModelIds =
            event.detail?.selectedModelIds ??
            (selectedModelId === 0 ? [] : [selectedModelId]);
          syncToolAvailability();
          updateModelInfoPanel();
        },
      );
      syncToolAvailability();
      scheduleModelInfoRefresh();
    </script>
  </body>
</html>
