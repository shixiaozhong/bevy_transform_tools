<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bevy Transform Tools</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #080a0f;
        touch-action: none;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      canvas {
        width: 100% !important;
        height: 100% !important;
        display: block;
      }

      .toolbar-shell {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 10;
        display: flex;
        justify-content: center;
        padding: 0 8px;
        pointer-events: none;
      }

      .toolbar {
        display: flex;
        align-items: center;
        gap: 4px;
        min-height: 78px;
        max-width: calc(100vw - 24px);
        overflow-x: auto;
        overflow-y: hidden;
        padding: 6px 12px 8px;
        border: 1px solid rgb(255 255 255 / 7%);
        border-top: 0;
        border-radius: 0 0 12px 12px;
        background: rgb(45 52 49 / 92%);
        color: #d9dddc;
        box-shadow: 0 14px 28px rgb(0 0 0 / 34%);
        backdrop-filter: blur(10px);
        pointer-events: auto;
        scrollbar-width: none;
      }

      .toolbar::-webkit-scrollbar {
        display: none;
      }

      .toolbar input[type="file"] {
        display: none;
      }

      .tool-button {
        width: 74px;
        height: 66px;
        flex: 0 0 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: rgb(235 239 238 / 88%);
        cursor: pointer;
      }

      .tool-button svg {
        width: 38px;
        height: 38px;
        stroke: currentColor;
        stroke-width: 1.8;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .tool-label {
        width: 100%;
        overflow: hidden;
        color: currentColor;
        font-size: 11px;
        line-height: 14px;
        letter-spacing: 0;
        text-align: center;
        white-space: nowrap;
      }

      .tool-button:hover,
      .tool-button:focus-visible {
        outline: none;
        background: rgb(255 255 255 / 8%);
        color: #ffffff;
      }

      .tool-button:active {
        background: rgb(255 255 255 / 14%);
      }

      .tool-button.is-active {
        background: rgb(255 255 255 / 12%);
        color: #ffffff;
      }

      .tool-button:disabled {
        color: rgb(196 202 207 / 56%);
        cursor: default;
      }

      .tool-button:disabled:hover {
        background: transparent;
      }

      .toolbar-divider {
        width: 1px;
        height: 52px;
        flex: 0 0 auto;
        margin: 0 10px;
        background: rgb(255 255 255 / 45%);
      }

      @media (max-width: 720px) {
        .toolbar-shell {
          justify-content: flex-start;
          padding: 0 8px;
        }

        .toolbar {
          min-height: 64px;
          padding: 5px 8px 7px;
        }

        .tool-button {
          width: 62px;
          height: 54px;
        }

        .tool-button svg {
          width: 30px;
          height: 30px;
        }

        .tool-label {
          font-size: 10px;
          line-height: 12px;
        }

        .toolbar-divider {
          height: 42px;
          margin: 0 6px;
        }

      }
    </style>
  </head>
  <body>
    <div class="toolbar-shell">
      <div class="toolbar" role="toolbar" aria-label="Model tools">
        <input id="model-file" type="file" accept=".obj,.stl" />
        <button
          id="import-model"
          class="tool-button"
          type="button"
          title="导入模型"
          aria-label="导入模型"
        >
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <path d="M13 19 31 9l18 10v22L31 51 13 41Z" />
            <path d="M13 19 31 29l18-10" />
            <path d="M31 29v22" />
            <circle cx="49" cy="46" r="10" />
            <path d="M49 39v14M42 46h14" />
          </svg>
          <span class="tool-label">导入模型</span>
        </button>
        <div class="toolbar-divider" aria-hidden="true"></div>
        <button
          id="move-tool"
          class="tool-button"
          type="button"
          title="移动"
          aria-label="移动"
          data-requires-selection
          disabled
        >
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <path d="M32 8v48" />
            <path d="M24 16 32 8l8 8" />
            <path d="M24 48 32 56l8-8" />
            <path d="M8 32h48" />
            <path d="M16 24 8 32l8 8" />
            <path d="M48 24 56 32l-8 8" />
            <path d="M24 24h16v16H24Z" />
          </svg>
          <span class="tool-label">移动</span>
        </button>
        <button
          id="scale-tool"
          class="tool-button"
          type="button"
          title="缩放"
          aria-label="缩放"
          data-requires-selection
          disabled
        >
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <path d="M15 15h14M15 15v14M49 49H35M49 49V35" />
            <path d="M20 20 30 30M44 44 34 34" />
            <path d="M35 15h14v14M49 15 37 27" />
            <path d="M15 35v14h14M15 49l12-12" />
            <path d="M25 25h14v14H25Z" />
          </svg>
          <span class="tool-label">缩放</span>
        </button>
        <button
          id="rotate-tool"
          class="tool-button"
          type="button"
          title="旋转"
          aria-label="旋转"
          data-requires-selection
          disabled
        >
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <path d="M45 18a19 19 0 1 0 5 20" />
            <path d="M45 18h11V7" />
            <path d="M23 25h18v18H23Z" />
            <path d="M32 18v7M32 43v7" />
          </svg>
          <span class="tool-label">旋转</span>
        </button>
        <button
          class="tool-button"
          type="button"
          title="选择底面"
          aria-label="选择底面"
          data-requires-selection
          disabled
        >
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <path d="M16 18 32 9l16 9v20L32 47 16 38Z" />
            <path d="M16 18 32 27l16-9" />
            <path d="M32 27v20" />
            <path d="M18 40 32 32l14 8-14 8Z" />
            <path d="M22 50h20" />
          </svg>
          <span class="tool-label">选择底面</span>
        </button>
        <button
          class="tool-button"
          type="button"
          title="剪切"
          aria-label="剪切"
          data-requires-selection
          disabled
        >
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <path d="M14 20 32 10l18 10v18L32 48 14 38Z" />
            <path d="M14 20 32 30l18-10" />
            <path d="M18 47 50 17" />
            <circle cx="17" cy="50" r="5" />
            <circle cx="47" cy="20" r="5" />
          </svg>
          <span class="tool-label">剪切</span>
        </button>
        <div class="toolbar-divider" aria-hidden="true"></div>
        <button
          id="center-model"
          class="tool-button"
          type="button"
          title="居中"
          aria-label="居中"
          data-requires-selection
          disabled
        >
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <path d="M32 10v12M32 42v12M10 32h12M42 32h12" />
            <path d="M23 23h18v18H23Z" />
            <circle cx="32" cy="32" r="4" />
            <path d="M17 17 23 23M47 17 41 23M17 47 23 41M47 47 41 41" />
          </svg>
          <span class="tool-label">居中</span>
        </button>
        <button
          id="drop-model"
          class="tool-button"
          type="button"
          title="贴底面"
          aria-label="贴底面"
          data-requires-selection
          disabled
        >
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <path d="M16 17 32 8l16 9v19L32 45 16 36Z" />
            <path d="M16 17 32 26l16-9" />
            <path d="M32 26v19" />
            <path d="M32 46v9" />
            <path d="M24 48 32 56l8-8" />
            <path d="M13 56h38" />
          </svg>
          <span class="tool-label">贴底面</span>
        </button>
      </div>
    </div>

    <script type="module">
      import init, {
        activate_move_tool_mode,
        activate_rotate_tool_mode,
        activate_scale_tool_mode,
        center_model,
        clear_tool_mode,
        drop_model_to_platform,
        load_obj_model,
        load_stl_model,
      } from "./pkg/bevy_transform_tools.js";

      await init();

      window.addEventListener(
        "wheel",
        (event) => {
          if (event.ctrlKey || event.metaKey) {
            event.preventDefault();
          }
        },
        { passive: false },
      );

      for (const eventName of ["gesturestart", "gesturechange", "gestureend"]) {
        window.addEventListener(eventName, (event) => event.preventDefault(), {
          passive: false,
        });
      }

      const fileInput = document.querySelector("#model-file");
      const importButton = document.querySelector("#import-model");
      const moveButton = document.querySelector("#move-tool");
      const scaleButton = document.querySelector("#scale-tool");
      const rotateButton = document.querySelector("#rotate-tool");
      const centerButton = document.querySelector("#center-model");
      const dropButton = document.querySelector("#drop-model");
      const selectionTools = document.querySelectorAll(
        "[data-requires-selection]",
      );
      let activeTool = null;

      importButton.addEventListener("click", () => {
        fileInput.click();
      });

      fileInput.addEventListener("change", async () => {
        const file = fileInput.files?.[0];
        if (!file) return;

        const extension = file.name.split(".").pop()?.toLowerCase();
        if (extension === "obj") {
          load_obj_model(file.name, await file.text());
        } else if (extension === "stl") {
          load_stl_model(file.name, new Uint8Array(await file.arrayBuffer()));
        }

        fileInput.value = "";
      });

      moveButton.addEventListener("click", () => {
        if (selectedModelId === 0) {
          return;
        }

        if (activeTool === "move") {
          clear_tool_mode();
          setActiveToolButton(null);
        } else {
          activate_move_tool_mode();
          setActiveToolButton("move");
        }
      });

      rotateButton.addEventListener("click", () => {
        if (selectedModelId === 0) {
          return;
        }

        if (activeTool === "rotate") {
          clear_tool_mode();
          setActiveToolButton(null);
        } else {
          activate_rotate_tool_mode();
          setActiveToolButton("rotate");
        }
      });

      scaleButton.addEventListener("click", () => {
        if (selectedModelId === 0) {
          return;
        }

        if (activeTool === "scale") {
          clear_tool_mode();
          setActiveToolButton(null);
        } else {
          activate_scale_tool_mode();
          setActiveToolButton("scale");
        }
      });

      centerButton.addEventListener("click", () => {
        if (selectedModelId !== 0) {
          center_model(selectedModelId);
        }
      });

      dropButton.addEventListener("click", () => {
        if (selectedModelId !== 0) {
          drop_model_to_platform(selectedModelId);
        }
      });

      const syncToolAvailability = () => {
        const hasSelection = selectedModelId !== 0;
        for (const button of selectionTools) {
          button.disabled = !hasSelection;
        }
        if (!hasSelection) {
          setActiveToolButton(null);
        }
      };
      const setActiveToolButton = (tool) => {
        activeTool = tool;
        moveButton.classList.toggle("is-active", tool === "move");
        scaleButton.classList.toggle("is-active", tool === "scale");
        rotateButton.classList.toggle("is-active", tool === "rotate");
      };
      let selectedModelId = 0;

      window.addEventListener(
        "bevy-transform-tools:selection-change",
        (event) => {
          selectedModelId = event.detail?.selectedModelId ?? 0;
          syncToolAvailability();
        },
      );
      syncToolAvailability();
    </script>
  </body>
</html>
