[package]
name = "bevy_transform_tools"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "bevy_transform_tools_native"
path = "src/main.rs"

[dependencies]
bevy = "0.18.1"
stl_io = "0.11.0"
tobj = { version = "4.0.3", default-features = false }
wasm-bindgen = "0.2.122"
